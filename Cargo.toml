[package]
name = "todo"
version = "0.1.0"
edition = "2021"
authors = ["TaskMaster Contributors"]
description = "High-performance cross-platform Todo app with Web, TUI, CLI, and PWA mobile/desktop support"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/itsvrushabh/todo"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["json", "query"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"
qrcode = { version = "0.14", default-features = false }
local-ip-address = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.16"
reqwest = { version = "0.12", features = ["json"] }
