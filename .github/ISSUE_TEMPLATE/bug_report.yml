name: 🐛 Bug Report
description: File a bug report to help improve TaskMaster
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating System / Platform
      description: Which environment did the issue occur in?
      options:
        - Linux (TUI / CLI / Web)
        - Windows (CLI / Web / Desktop)
        - macOS (CLI / Web / Desktop)
        - Android (PWA / Mobile)
        - iPhone / iPad (iOS Safari PWA)
        - Docker / Container
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run `todo serve`
        2. Execute `...`
        3. Observe error `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
