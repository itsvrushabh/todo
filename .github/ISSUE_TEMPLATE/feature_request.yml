name: ✨ Feature Request
description: Suggest an idea or new capability for TaskMaster
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! Before creating a PR, please define the requirements here.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you want to happen and how it should look or behave.
    validations:
      required: true
  - type: checkboxes
    id: targets
    attributes:
      label: Applicable Interfaces
      options:
        - label: Web UI & PWA (Desktop & Mobile)
        - label: Terminal User Interface (TUI)
        - label: Command Line Interface (CLI)
        - label: REST API & Backend
