name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Web PWA & API Docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          gh release download -R trunk-rs/trunk -p "trunk-x86_64-unknown-linux-gnu.tar.gz" -O - | sudo tar -xz -C /usr/local/bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WebAssembly Web App
        run: trunk build --release --public-url "./"

      - name: Generate Rust API Documentation
        run: cargo doc --no-deps --lib

      - name: Assemble GitHub Pages distribution
        run: |
          # Ensure icons and PWA manifests are in dist
          cp -r static/icons dist/ || true
          cp static/manifest.json dist/ || true
          # Copy Rust documentation
          mkdir -p dist/docs
          cp -r target/doc/* dist/docs/

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
