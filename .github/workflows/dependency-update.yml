name: Bot Dependency Upgrade

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade-dependencies:
    name: Upgrade Cargo Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run cargo update
        id: cargo_update
        run: |
          git status
          cargo update
          if git diff --quiet Cargo.lock; then
            echo "No dependency updates available."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Dependencies updated in Cargo.lock"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify build and tests on upgraded crates
        if: steps.cargo_update.outputs.has_changes == 'true'
        run: |
          cargo check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Create Pull Request with Upgrades
        if: steps.cargo_update.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="bot/cargo-update-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add Cargo.lock
          git commit -m "chore(deps): weekly automated cargo dependency upgrade"
          git push origin "$BRANCH_NAME" --force

          gh pr create \
            --title "chore(deps): weekly automated cargo dependency upgrade" \
            --body "## 🤖 Automated Dependency Upgrade Bot

This automated PR updates project dependencies in \`Cargo.lock\` to their latest compatible versions.

### Verification Checklist
- [x] \`cargo check\` passed
- [x] \`cargo clippy\` passed with zero warnings
- [x] \`cargo test\` passed across all unit and integration tests

*Automated by TaskMaster Dependency Bot.*" \
            --base main \
            --head "$BRANCH_NAME" \
            --label "dependencies,automated" || echo "PR may already exist."
