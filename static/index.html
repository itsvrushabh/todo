<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Todo App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #181825;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .card {
            background: #1e1e2e;
            border: 1px solid #313244;
            border-radius: 12px;
            padding: 32px;
            max-width: 540px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h1 { color: #89b4fa; margin-top: 0; font-size: 24px; }
        p { color: #a6adc8; line-height: 1.6; }
        .btn {
            display: inline-block;
            background: #89b4fa;
            color: #11111b;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 6px;
            margin: 8px;
        }
        code { background: #313244; padding: 2px 6px; border-radius: 4px; color: #f9e2af; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Todo Server</h1>
        <p>The backend REST API and synchronization service is running.</p>
        <div style="margin-top: 24px;">
            <a class="btn" href="/api/health">REST API Health</a>
            <a class="btn" href="/api/todos">View Tasks JSON</a>
        </div>
        <p style="margin-top: 24px; font-size: 13px; color: #6c7086;">
            Launch the native desktop interface: <code>todo gui</code><br>
            Or launch the WebAssembly interface: <code>trunk serve</code>
        </p>
    </div>
</body>
</html>
