# Fly.io deployment configuration for TaskMaster Todo
app = "taskmaster-todo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TODO_STORAGE_PATH = "/data/todos.json"
  RUST_LOG = "info"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "todo_data"
  destination = "/data"
  initial_size = "1gb"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"
