<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div>
          <h1>TaskMaster</h1>
          <p class="subtitle" id="currentDate">Stay organized and get things done</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="themeToggleBtn" class="icon-button" title="Toggle Light/Dark Theme" aria-label="Toggle theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Progress Card -->
    <div class="progress-card">
      <div class="progress-info">
        <span class="progress-title">Overall Progress</span>
        <span class="progress-stats" id="progressStatsText">0 / 0 completed (0%)</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBarFill" style="width: 0%"></div>
      </div>
      <div class="priority-pills">
        <button class="pill high" data-priority="high" title="Filter by High priority">
          <span class="dot"></span> High: <strong id="highCount">0</strong>
        </button>
        <button class="pill medium" data-priority="medium" title="Filter by Medium priority">
          <span class="dot"></span> Med: <strong id="medCount">0</strong>
        </button>
        <button class="pill low" data-priority="low" title="Filter by Low priority">
          <span class="dot"></span> Low: <strong id="lowCount">0</strong>
        </button>
      </div>
    </div>

    <!-- Add Task Card -->
    <form id="addTodoForm" class="add-todo-card">
      <div class="input-row">
        <input 
          type="text" 
          id="todoTitleInput" 
          placeholder="Add a new task... (press Enter to save)" 
          required 
          autocomplete="off"
          maxlength="200"
        />
        <button type="button" id="toggleDetailsBtn" class="secondary-btn" title="Add details or notes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="4" y1="9" x2="20" y2="9"></line>
            <line x1="4" y1="15" x2="14" y2="15"></line>
          </svg>
          <span>Note</span>
        </button>
        <button type="submit" id="addBtn" class="primary-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add</span>
        </button>
      </div>

      <div id="detailsCollapsible" class="details-collapse collapsed">
        <textarea 
          id="todoDescInput" 
          placeholder="Add optional notes or descriptions..." 
          rows="2"
          maxlength="1000"
        ></textarea>
        <div class="priority-selector">
          <label>Priority:</label>
          <div class="priority-options">
            <label class="priority-radio">
              <input type="radio" name="priority" value="low">
              <span class="priority-tag low-tag">Low</span>
            </label>
            <label class="priority-radio">
              <input type="radio" name="priority" value="medium" checked>
              <span class="priority-tag medium-tag">Medium</span>
            </label>
            <label class="priority-radio">
              <input type="radio" name="priority" value="high">
              <span class="priority-tag high-tag">High</span>
            </label>
          </div>
        </div>
      </div>
    </form>

    <!-- Filter & Search Toolbar -->
    <div class="toolbar">
      <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all">All</button>
        <button class="tab-btn" data-filter="active">Active</button>
        <button class="tab-btn" data-filter="completed">Completed</button>
      </div>

      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search tasks..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" style="display: none;">&times;</button>
      </div>
    </div>

    <!-- Active Priority Filter indicator (if set) -->
    <div id="activePriorityBadge" class="active-priority-badge" style="display: none;">
      <span>Filtering by <strong id="filterPriorityName"></strong> priority</span>
      <button id="clearPriorityFilterBtn" title="Clear priority filter">&times;</button>
    </div>

    <!-- Task List -->
    <div class="task-list-container">
      <ul id="todoList" class="todo-list">
        <!-- Rendered dynamically -->
      </ul>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <h3 id="emptyTitle">No tasks found</h3>
        <p id="emptySubtitle">You have cleared all your tasks or no tasks match your filter.</p>
      </div>
    </div>

    <!-- List Footer -->
    <footer class="app-footer">
      <span id="itemsLeftCount">0 items left</span>
      <div class="footer-actions">
        <button id="clearCompletedBtn" class="text-danger-btn" title="Remove all completed tasks">
          Clear completed
        </button>
      </div>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Edit Task Modal -->
  <div id="editModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <button id="closeEditModalBtn" class="modal-close-btn">&times;</button>
      </div>
      <form id="editTodoForm">
        <input type="hidden" id="editTodoId">
        <div class="form-group">
          <label for="editTodoTitle">Task Title</label>
          <input type="text" id="editTodoTitle" required maxlength="200" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="editTodoDesc">Notes / Description</label>
          <textarea id="editTodoDesc" rows="3" maxlength="1000"></textarea>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <div class="priority-options">
            <label class="priority-radio">
              <input type="radio" name="editPriority" value="low">
              <span class="priority-tag low-tag">Low</span>
            </label>
            <label class="priority-radio">
              <input type="radio" name="editPriority" value="medium">
              <span class="priority-tag medium-tag">Medium</span>
            </label>
            <label class="priority-radio">
              <input type="radio" name="editPriority" value="high">
              <span class="priority-tag high-tag">High</span>
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelEditBtn" class="secondary-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
